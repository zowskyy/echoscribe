name: Gate Check

on:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Bootstrap agent environment
        run: bash scripts/install-agent-environment.sh

      - name: Gate hello_passing sample
        run: bash scripts/gate-file.sh --file samples/hello_passing.py
